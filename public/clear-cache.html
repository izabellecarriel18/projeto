<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpar Cache - UltimateCar3D</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #000;
      color: #fff;
    }
    button {
      background: #3b82f6;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
    }
    button:hover {
      background: #2563eb;
    }
    .status {
      padding: 15px;
      margin: 15px 0;
      border-radius: 8px;
      background: #1f2937;
    }
    .success {
      background: #065f46;
    }
    .error {
      background: #7f1d1d;
    }
  </style>
</head>
<body>
  <h1>🔧 Ferramenta de Manutenção</h1>
  <p>Use esta página para limpar o cache e corrigir problemas de atualização do aplicativo.</p>

  <button onclick="clearAllCache()">Limpar Todo o Cache</button>
  <button onclick="unregisterServiceWorker()">Remover Service Worker</button>
  <button onclick="clearAllAndReload()">Limpar Tudo e Recarregar</button>

  <div id="status" class="status"></div>

  <script>
    const statusDiv = document.getElementById('status');

    function showStatus(message, isSuccess = true) {
      statusDiv.textContent = message;
      statusDiv.className = isSuccess ? 'status success' : 'status error';
    }

    async function clearAllCache() {
      try {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(name => caches.delete(name)));
        showStatus(`✅ ${cacheNames.length} caches removidos com sucesso!`);
      } catch (error) {
        showStatus(`❌ Erro ao limpar cache: ${error.message}`, false);
      }
    }

    async function unregisterServiceWorker() {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(reg => reg.unregister()));
        showStatus(`✅ ${registrations.length} service workers removidos!`);
      } catch (error) {
        showStatus(`❌ Erro ao remover service worker: ${error.message}`, false);
      }
    }

    async function clearAllAndReload() {
      try {
        await clearAllCache();
        await unregisterServiceWorker();
        showStatus('✅ Tudo limpo! Recarregando em 2 segundos...');
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (error) {
        showStatus(`❌ Erro: ${error.message}`, false);
      }
    }
  </script>
</body>
</html>
